<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StackCraft | Client Search</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="fontawesome-free-7.0.0-web/css/all.min.css">

    <!-- Google Analytics -->
    <script type="text/javascript">
        (function (c, l, a, r, i, t, y) {
            c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
            t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
            y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", "xyogdyuwdr");
    </script>

    <style>
        /* Existing Client Search Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .upload-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            padding: 20px;
            border: 2px dashed #3498db;
            border-radius: 8px;
            background: #ebf5fb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #2c3e50;
            color: #fff;
            position: sticky;
            top: 0;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .wa-btn {
            display: inline-block;
            background-color: #25D366;
            color: #fff;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s;
        }

        .wa-btn:hover {
            background-color: #128C7E;
        }

        .disabled-btn {
            background-color: #bdc3c7;
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            display: inline-block;
            cursor: not-allowed;
        }

        .rating {
            color: #f39c12;
            font-weight: bold;
        }

        .address-col {
            max-width: 300px;
        }

        /* NEW: Security & UI Enhancements */
        #auth-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
        }

        #secure-content {
            display: none;
        }

        /* Hidden by default for security */
        .back-nav {
            margin-bottom: 20px;
        }

        .back-nav a {
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .back-nav a:hover {
            color: #2980b9;
        }
        /* --- NEW: Action Buttons for Client Search Table --- */
        .action-cell-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
        }

        .admin-action-btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border-radius: 6px; 
            color: #fff; transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            text-decoration: none; border: none; cursor: pointer;
        }

        .call-btn { background: #2563EB; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2); }
        .call-btn:hover { background: #1D4ED8; transform: translateY(-3px); }
        
        .sms-btn { background: #F59E0B; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.2); }
        .sms-btn:hover { background: #D97706; transform: translateY(-3px); }
        
        .wa-btn { background: #10b981; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2); }
        .wa-btn:hover { background: #059669; transform: translateY(-3px); }
    </style>
</head>

<body>

    <!-- Security Loader -->
    <div id="auth-loader">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 3rem; color: #3498db; margin-bottom: 1rem;"></i>
        <h3 style="color: #2c3e50;">Verifying Admin Access...</h3>
    </div>

    <!-- Main Content (Hidden until authenticated) -->
    <div id="secure-content">
        <div class="container">
            <div class="back-nav">
                <a href="admin.html"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
            </div>

            <h1>Bakery Client Leads</h1>

            <div class="upload-section">
                <h3>Have a new list? Upload your JSON file here</h3>
                <input type="file" id="jsonInput" accept=".json">
            </div>

            <!-- NEW: Rating Filter UI -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h3 style="margin: 0; color: #3498db; font-size: 1.1rem;"><i class="fa-solid fa-address-book"></i> Client Directory</h3>
                
                <div style="display: flex; align-items: center; gap: 10px;">
                    <label for="ratingFilter" style="font-weight: bold; color: #2c3e50; font-size: 0.9rem;">
                        <i class="fa-solid fa-star" style="color: #f39c12;"></i> Filter Rating:
                    </label>
                    <select id="ratingFilter" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #bdc3c7; outline: none; cursor: pointer; font-family: inherit; font-weight: bold;">
                        <option value="all">All Ratings</option>
                        <option value="4.5">4.5 & Above</option>
                        <option value="4.0">4.0 & Above</option>
                        <option value="3.5">3.5 & Above</option>
                        <option value="unrated">Unrated / No Rating</option>
                    </select>
                </div>
            </div>

            <table id="clientsTable">
                <thead>
                    <tr>
                        <th>Bakery Name</th>
                        <th>Category</th>
                        <th class="address-col">Location</th>
                        <th>Rating</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will populate here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 1. Firebase Auth Logic (Must run first) -->
    <script type="module" src="client-search.js"></script>

    <!-- 2. Your Existing Data & Logic (Upgraded with Secure Firestore Sync) -->
    <script type="module">
        import { db } from "./firebase-config.js";
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Global status map linked to Firestore
        let sentStatusMap = {};
        const trackingRef = doc(db, "admin_status", "contact_tracking");

        // --- DYNAMIC MESSAGE GENERATOR (WITH ANTI-SPAM RANDOMIZATION) ---
        function getDynamicMessage(clientName) {
            const safeName = clientName && clientName !== 'N/A' ? clientName.trim() : "business";

            // 1. Randomize English Greetings & Openings
            const greetingsEn = ["Hello!", "Hi there!", "Greetings!", "Hi!"];
            const openingsEn = [
                `I noticed your business, ${safeName}.`,
                `I came across ${safeName} online.`,
                `We saw the great work you're doing at ${safeName}.`
            ];
            
            const randomGreetEn = greetingsEn[Math.floor(Math.random() * greetingsEn.length)];
            const randomOpenEn = openingsEn[Math.floor(Math.random() * openingsEn.length)];

            // 2. Randomize Tamil Greetings
            const greetingsTa = ["வணக்கம்!", "நல்வரவு!", "அன்பான வணக்கம்!"];
            const randomGreetTa = greetingsTa[Math.floor(Math.random() * greetingsTa.length)];

            // 3. Assemble the uniquely generated message
            const customRawMessage = `${randomGreetEn} ${randomOpenEn} We specialize in building professional, high-quality websites to help grow your online presence. Let me know if you are interested in getting a website for your shop!\n\n${randomGreetTa} உங்கள் ${safeName} தொழிலை இணையத்தில் (Online) வளர்க்கவும், புதிய வாடிக்கையாளர்களைப் பெறவும் நாங்கள் பிரத்யேகமாக தொழில்முறை வலைத்தளங்களை (websites) உருவாக்கித் தருகிறோம். வலைத்தளம் தேவைப்பட்டால், தயவுசெய்து எங்களுக்குத் தெரிவிக்கவும்.\n\nVisit my website: https://stackcraft-technologies-7f3eb.web.app/`;

            return encodeURIComponent(customRawMessage);
        }

        // --- RENDER TABLE WITH FIREBASE LOGIC & DYNAMIC NAMING ---
        function renderTable(data, sourceFileName = "") {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; 
            
            const safeData = Array.isArray(data) ? data : (data.results || data.items || []);

            safeData.forEach((client, index) => {
                const tr = document.createElement('tr');
                
                // NEW: Add CSS class and data attribute for the Rating Filter
                tr.className = 'client-row';
                tr.setAttribute('data-rating', client.totalScore || 0);

                // 1-4. Basic Client Info
                const clientTitle = client.title || client.name || 'N/A';
                const tdName = document.createElement('td'); tdName.textContent = clientTitle; tr.appendChild(tdName);
                const tdCat = document.createElement('td'); tdCat.textContent = client.categoryName || client.category || 'N/A'; tr.appendChild(tdCat);
                const tdCity = document.createElement('td'); tdCity.className = 'address-col'; tdCity.textContent = client.address || client.city || 'N/A'; tr.appendChild(tdCity);
                const tdRating = document.createElement('td'); tdRating.innerHTML = client.totalScore ? `<span class="rating">★ ${client.totalScore}</span>` : 'N/A'; tr.appendChild(tdRating);

                // ---> NEW: Generate message specifically using THIS client's exact name <---
                const currentMessage = getDynamicMessage(clientTitle !== 'N/A' ? clientTitle : "");

                // 5. Action Buttons (Call, SMS, WhatsApp) with Secure DB State
                const tdAction = document.createElement('td');
                let rawPhone = client.phoneUnformatted || client.phone || client.phoneNumber || '';
                let phoneStr = String(rawPhone); 
                let phoneClean = phoneStr.replace(/\D/g, '');

                if (phoneClean && phoneClean.length > 5) {
                    if (phoneClean.length === 10) phoneClean = '91' + phoneClean; 

                    const clientKey = `${client.title}_${phoneClean}`.replace(/[~*/\[\]\.]/g, '_');
                    let isSent = sentStatusMap[clientKey] === true;

                    const setSentUI = (btn) => {
                        btn.style.backgroundColor = '#10b981';
                        btn.style.boxShadow = '0 0 10px rgba(16, 185, 129, 0.4)';
                        btn.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
                    };

                    const activeStyle = isSent ? 'background-color: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);' : '';
                    const callIcon = isSent ? '<i class="fa-solid fa-circle-check"></i>' : '<i class="fa-solid fa-phone"></i>';
                    const smsIcon = isSent ? '<i class="fa-solid fa-circle-check"></i>' : '<i class="fa-solid fa-comment-sms"></i>';
                    const waIcon = isSent ? '<i class="fa-solid fa-circle-check"></i>' : '<i class="fa-brands fa-whatsapp"></i>';

                    tdAction.innerHTML = `
                        <div class="action-cell-container">
                            <a href="tel:+${phoneClean}" class="admin-action-btn call-btn track-btn" style="${activeStyle}" title="Call Client">${callIcon}</a>
                            <a href="sms:+${phoneClean}?body=${currentMessage}" class="admin-action-btn sms-btn track-btn" style="${activeStyle}" title="Send SMS">${smsIcon}</a>
                            <a href="https://wa.me/${phoneClean}?text=${currentMessage}" target="_blank" class="admin-action-btn wa-btn track-btn" style="${activeStyle}" title="Send WhatsApp">${waIcon}</a>
                        </div>
                    `;
                    
                    // EVENT LISTENER: Triggers on Call, SMS, or WhatsApp
                    const actionBtns = tdAction.querySelectorAll('.track-btn');
                    actionBtns.forEach(btn => {
                        btn.addEventListener('click', async function() {
                            
                            // --- NEW: WHATSAPP ANTI-SPAM DAILY COUNTER ---
                            if (this.classList.contains('wa-btn')) {
                                let today = new Date().toDateString();
                                let dailyCount = parseInt(localStorage.getItem(`waSentCount_${today}`) || "0");
                                dailyCount++;
                                localStorage.setItem(`waSentCount_${today}`, dailyCount);
                                
                                // Warn the admin when they reach 30 and 45 messages in a single day
                                if (dailyCount === 30) {
                                    alert(`⚠️ SAFETY WARNING: You have sent ${dailyCount} WhatsApp messages today.\n\nTo prevent WhatsApp from restricting your account, please take a 1 to 2 hour break before sending more.`);
                                } else if (dailyCount === 45) {
                                    alert(`🛑 CRITICAL WARNING: You have sent ${dailyCount} messages today!\n\nDo not send any more messages today. WhatsApp will ban your account if you send 50+ messages to unsaved numbers in a day.`);
                                }
                            }
                            // ----------------------------------------------

                            // 1. Visually update ALL 3 buttons for this client instantly
                            actionBtns.forEach(b => setSentUI(b));
                            
                            // 2. Update local storage for immediate speed
                            sentStatusMap[clientKey] = true;
                            localStorage.setItem("sentStatusMap", JSON.stringify(sentStatusMap));
                            
                            // 3. SECURE SYNC: Save to Firestore for cross-device tracking
                            try {
                                await setDoc(trackingRef, { [clientKey]: true }, { merge: true });
                            } catch (err) {
                                console.error("Database sync error: ", err);
                            }
                        });
                    });

                } else {
                    tdAction.innerHTML = `<span class="disabled-btn"><i class="fa-solid fa-phone-slash"></i> No Phone</span>`;
                }
                tr.appendChild(tdAction);
                tbody.appendChild(tr);
            });

            // Automatically re-apply filter when a new file is uploaded
            if (typeof applyRatingFilter === 'function') applyRatingFilter();
        }

        // KEEP YOUR EXISTING JSON ARRAY HERE
        const embeddedData = [
            { "title": "Jashiha's Homemade Cakes", "categoryName": "Bakery", "address": "17-E, West Street, Adirampattinam", "totalScore": 4.9, "phoneUnformatted": "+917010425862" },
            { "title": "Sri Jothi Bakery & Sweets", "categoryName": "Bakery", "address": "89QP+M8J, Adirampattinam", "totalScore": 4.8, "phoneUnformatted": "+917305195685" },
            { "title": "KARAIKAL IYANGARS FOODS LIMITED", "categoryName": "Bakery", "address": "No: 23/10, Post Office Road", "totalScore": 4.7, "phoneUnformatted": "" }
            // Note: Paste the rest of your bakery data here...
        ];

        function updatePageTitle(fileName) {
            const h1 = document.querySelector('h1');
            if (!fileName) { h1.textContent = "Bakery Client Leads"; return; }
            let cleanName = fileName.replace('.json', '').replace(/[-_]/g, ' ');
            cleanName = cleanName.replace(/\b\w/g, char => char.toUpperCase());
            h1.textContent = cleanName + " Client Leads";
        }

        // --- CROSS-DEVICE DATABASE INITIALIZATION ---
        async function initializeDashboard() {
            // First, securely fetch the master state from Firestore
            try {
                const docSnap = await getDoc(trackingRef);
                if (docSnap.exists()) {
                    sentStatusMap = docSnap.data();
                    localStorage.setItem("sentStatusMap", JSON.stringify(sentStatusMap)); 
                }
            } catch (error) {
                console.warn("Could not fetch DB. Falling back to local device tracking.", error);
                sentStatusMap = JSON.parse(localStorage.getItem("sentStatusMap") || "{}");
            }

            const storedLeads = localStorage.getItem("savedClientLeads");
            const savedFileName = localStorage.getItem("lastUploadedFileName") || "";
            updatePageTitle(savedFileName);
            
            if (storedLeads) {
                try { renderTable(JSON.parse(storedLeads), savedFileName); } 
                catch(e) { renderTable(embeddedData, "cake-shop"); updatePageTitle("cake-shop"); }
            } else {
                renderTable(embeddedData, "cake-shop");
                updatePageTitle("cake-shop");
            }
        }

        // Boot up the secure application
        initializeDashboard();
        
        // Handle New File Uploads
        document.getElementById('jsonInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const fileName = file.name; 
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const parsedData = JSON.parse(event.target.result);
                    localStorage.setItem("savedClientLeads", JSON.stringify(parsedData));
                    localStorage.setItem("lastUploadedFileName", fileName);
                    updatePageTitle(fileName);
                    renderTable(parsedData, fileName); 
                } catch (err) {
                    alert('Error parsing JSON file. Please ensure it is a valid format.');
                }
            };
            reader.readAsText(file);
            this.value = ''; 
        });

        // --- NEW: RATING FILTER LOGIC ---
        function applyRatingFilter() {
            const filterDropdown = document.getElementById('ratingFilter');
            if (!filterDropdown) return;
            
            const filterValue = filterDropdown.value;
            const rows = document.querySelectorAll('.client-row');
            
            rows.forEach(row => {
                const rating = parseFloat(row.getAttribute('data-rating'));
                let show = true;
                
                if (filterValue !== 'all') {
                    if (filterValue === 'unrated') {
                        // Shows clients with a 0 rating or no rating data
                        show = rating === 0 || isNaN(rating);
                    } else {
                        // Compares the client rating to the selected dropdown limit
                        show = rating >= parseFloat(filterValue);
                    }
                }
                
                row.style.display = show ? '' : 'none';
            });
        }

        // Attach listener to trigger whenever the admin changes the dropdown
        document.getElementById('ratingFilter')?.addEventListener('change', applyRatingFilter);
    </script>
</body>

</html>
